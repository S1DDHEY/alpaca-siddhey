[project]
name = "options-alpha-agent"
version = "0.1.0"
description = "Autonomous Alpaca options trading agent with CLI-backed audit logs and dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "streamlit>=1.36.0",
    "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[project.scripts]
alpha-agent = "options_alpha_agent.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["options_alpha_agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"
